name: Deploy

on: push

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Test
        env:
          TEST_DEEPSEEK_API_KEY: ${{ secrets.TEST_DEEPSEEK_API_KEY }}
        run: ./kotlin check

      - name: Build
        run: ./kotlin package --module app --module cli --format executable-jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars
          path: |
            build/tasks/_app_executableJarJvm/
            build/tasks/_cli_executableJarJvm/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      KEYCHAIN: build.keychain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: build/tasks

      - name: Next version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -z "$latest" ]]; then
            version=1.0.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup keychain
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: .github/scripts/setup-keychain.sh

      - name: Sign nested binaries
        env:
          SIGNING_NAME: ${{ secrets.MACOS_SIGNING_NAME }}
        run: |
          .github/scripts/sign-nested-binaries.sh \
            build/tasks/_app_executableJarJvm/app-jvm-executable.jar \
            build/tasks/_cli_executableJarJvm/cli-jvm-executable.jar

      - name: Package app
        env:
          SIGNING_NAME: ${{ secrets.MACOS_SIGNING_NAME }}
          BUNDLE_ID: ${{ secrets.MACOS_BUNDLE_ID }}
        run: |
          jpackage \
            --type dmg \
            --name "Resume Tailor" \
            --app-version "$VERSION" \
            --icon app/icon/icon.icns \
            --input build/tasks/_app_executableJarJvm \
            --main-jar app-jvm-executable.jar \
            --dest dist \
            --mac-package-identifier "$BUNDLE_ID" \
            --mac-sign \
            --mac-signing-keychain "$KEYCHAIN" \
            --mac-signing-key-user-name "$SIGNING_NAME"

      - name: Package cli
        env:
          SIGNING_NAME: ${{ secrets.MACOS_SIGNING_NAME }}
          BUNDLE_ID: ${{ secrets.MACOS_BUNDLE_ID }}
        run: |
          jpackage \
            --type pkg \
            --name resume-tailor \
            --app-version "$VERSION" \
            --input build/tasks/_cli_executableJarJvm \
            --main-jar cli-jvm-executable.jar \
            --dest dist \
            --mac-package-identifier "$BUNDLE_ID.cli" \
            --mac-sign \
            --mac-signing-keychain "$KEYCHAIN" \
            --mac-signing-key-user-name "$SIGNING_NAME"

      - name: Smoke test app
        run: .github/scripts/smoke-test-app.sh

      - name: Smoke test cli
        run: |
          pkgutil --expand-full dist/*.pkg "$RUNNER_TEMP/pkg"
          "$RUNNER_TEMP"/pkg/*/Payload/resume-tailor.app/Contents/MacOS/resume-tailor --help | grep 'Usage: resume-tailor'

      - name: Notarize
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: .github/scripts/notarize.sh

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.pkg

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
